
spring:
  application:
    name: webapp
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:xe
    driver-class-name: oracle.jdbc.OracleDriver
    username: hims
    password: root

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    properties:
        hibernate:
          format_sql: true
    show-sql: true

server:
  port: 5050

spring.mvc.pathmatch.matching-strategy: ant_path_matcher
# Collapse all endpoints by default
springdoc:
  swagger-ui:
    doc-expansion: none
    tags-sorter: alpha # Sort controllers alphabetically
    operations-sorter: alpha # Sort operations inside controllers alphabetically
